name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the app's Library page.
      placeholder: v2.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, Linux, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 130
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Anything printed in the app's console window (run with -verbose for more detail).
      render: text
