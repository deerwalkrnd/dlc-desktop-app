name: Video naming problem
description: A video doesn't show up, or shows up in the wrong place
labels: [naming]
body:
  - type: markdown
    attributes:
      value: |
        First check the **Skipped files** and **Warnings** on the app's Library page, or run `dlc-check <folder>`.
        The [naming guide](https://deerwalkrnd.github.io/dlc-desktop-app/docs/adding-videos) explains the format.
  - type: textarea
    id: names
    attributes:
      label: Exact file name(s)
      description: Copy and paste them; don't retype.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Where should it appear, and where does it appear?
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message from the Library page or dlc-check
      render: text
