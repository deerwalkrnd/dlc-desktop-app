name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Fuzz filename parser (legacy compatibility)
        run: go test ./internal/catalog -run '^$' -fuzz FuzzLegacyCompatibility -fuzztime 30s

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: make build

      - name: Smoke test the binary
        run: |
          mkdir -p smoke/DLC
          touch "smoke/DLC/Arjun Khatiwada - 1.2 - Factorization of Polynomials - Polynomials in Maths - Mathematics - OLD - 8 .mp4"
          ./bin/dlc-desktop-app -library smoke/DLC -addr 127.0.0.1:3999 -open=false &
          for i in $(seq 20); do curl -fs http://127.0.0.1:3999/healthz && break; sleep 0.5; done
          curl -fs http://127.0.0.1:3999/api/classes | grep -q '"number":8'
          curl -fs http://127.0.0.1:3999/ | grep -q '_app/immutable'
          ./bin/dlc-check smoke/DLC
