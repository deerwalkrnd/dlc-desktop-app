name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: make test

      # Optional code signing: add the repository secrets WINDOWS_CERT_PFX
      # (the .pfx file, base64-encoded) and WINDOWS_CERT_PASSWORD to enable it.
      - name: Prepare code signing
        id: sign
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No signing certificate configured; Windows executables will be unsigned."
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -yq osslsigncode
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "pfx=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_OUTPUT"
          echo "cmd=scripts/sign-windows.sh" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        env:
          WINDOWS_CERT_PFX: ${{ steps.sign.outputs.pfx }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: make release VERSION=${{ github.ref_name }} SIGN=${{ steps.sign.outputs.cmd }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes
