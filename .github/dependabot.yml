version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
    groups:
      docs: { patterns: ["*"] }
